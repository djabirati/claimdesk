name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: claimdesk
          POSTGRES_PASSWORD: claimdesk
          POSTGRES_DB: claimdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U claimdesk"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://claimdesk:claimdesk@localhost:5432/claimdesk
      TEST_DATABASE_URL: postgresql+psycopg://claimdesk:claimdesk@localhost:5432/claimdesk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy app scripts tests

      - name: Migrations apply and match the models
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

      - name: "Tests (no paid API call: the model is faked)"
        run: pytest -q
