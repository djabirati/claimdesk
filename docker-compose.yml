services:
  db:
    # Postgres with the pgvector extension, used for similar-case search in a later step.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: claimdesk
      POSTGRES_PASSWORD: claimdesk
      POSTGRES_DB: claimdesk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimdesk"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Runs once: applies the migrations and loads the demo orders, then exits.
  # The api and the worker start only after it has succeeded.
  migrate:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://claimdesk:claimdesk@db:5432/claimdesk
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/data:ro
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.seed"]

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://claimdesk:claimdesk@db:5432/claimdesk
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  # Takes triage jobs from the queue. Run several with: docker compose up --scale worker=3
  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://claimdesk:claimdesk@db:5432/claimdesk
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.worker"]

volumes:
  pgdata:
