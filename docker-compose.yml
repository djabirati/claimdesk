services:
  db:
    # Postgres with the pgvector extension, used for similar-case search in a later step.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: claimdesk
      POSTGRES_PASSWORD: claimdesk
      POSTGRES_DB: claimdesk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimdesk"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://claimdesk:claimdesk@db:5432/claimdesk
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data:ro
    command: >
      sh -c "alembic upgrade head && python -m scripts.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
